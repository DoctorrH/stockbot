name: Stock Bot

on:
  schedule:
    # Chạy vào 14:25 VN (07:25 UTC) từ thứ 2 đến thứ 6
    - cron: '25 7 * * 1-5'
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công

env:
  # Dòng này giúp giải quyết cảnh báo bạn vừa nhận được
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Bạn có thể đổi thành @v5 nếu GitHub yêu cầu sau này

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        run: python bot.py
