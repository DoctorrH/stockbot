name: Stockbot scan (14:25 ICT)

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # 14:25 (UTC+7, Vietnam) = 07:25 UTC.
    - cron: "25 7 * * 1-5"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
      VNSTOCK_SOURCE: KBS
      EXCHANGES: HOSE,HNX
      HISTORY_LENGTH: "130"
      VOLUME_CUTOFF_HHMM: "14:25"
      VOLUME_RATIO_MIN: "0.80"
      SCAN_ONCE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run scan once
        run: |
          python bot.py
